name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Migration cycle
        env:
          # Alembic loads Settings, which requires these; values are unused.
          ESI_CLIENT_ID: ci-placeholder
          ESI_CLIENT_SECRET: ci-placeholder
          SECRET_KEY: ci-placeholder-secret-key
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
