name: CI

# Least privilege for the GITHUB_TOKEN this workflow gets.
permissions:
  contents: read

on:
  push:
    branches: [main]
    # Document-only changes (planning surface, reference docs, license)
    # don't affect code — skip the test suite for them.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

jobs:
  test:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 over time; run on it
    # deliberately, not by label flip.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact version: setup-uv stopped publishing major/minor tags at v8
        # (immutable releases only). v7+ runs on Node 24.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Migration cycle
        env:
          # Alembic loads Settings, which requires these; values are unused.
          ESI_CLIENT_ID: ci-placeholder
          ESI_CLIENT_SECRET: ci-placeholder
          SECRET_KEY: ci-placeholder-secret-key
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
