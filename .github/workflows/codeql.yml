# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [main]
    # Document-only changes (planning surface, reference docs, license)
    # don't affect code — skip analysis for them. Trigger-level skipping
    # is safe here: nothing on push requires these checks.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # Pull requests always trigger: a required status check waits forever
  # on a workflow that never ran, so the docs-only skip decision lives
  # INSIDE the workflow (the `changes` job) — everything it gates off
  # then reports "Skipped", which branch protection treats as passing.
  pull_request:
    branches: [main]
  schedule:
    - cron: "32 13 * * 4"

jobs:
  changes:
    name: Detect changes (CodeQL)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect non-document changes
        id: filter
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -Ev '^docs/|\.md$|^LICENSE$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # always(): push/schedule events have no `changes` run (that job only
    # exists on pull requests), and a needed-but-skipped job would skip
    # this one too. The matrix must expand on every event — a matrix job
    # skipped at the JOB level reports a single check run under the
    # unexpanded template name, which starves the required per-language
    # checks on docs-only PRs. So the legs always start and the skip
    # decision happens at STEP level: a docs-only PR gets three fast,
    # successful legs. A failed `changes` job gates the merge itself,
    # since that check is required.
    if: always()
    # Runner size impacts CodeQL analysis time. To learn more, see:
    #   https://gh.io/recommended-hardware-resources-for-running-codeql
    #   https://gh.io/supported-runners-and-hardware-resources
    #   https://gh.io/using-larger-runners (GitHub.com only; consider larger
    #   runners for possible analysis time improvements).
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-26.04' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # CodeQL supports the following values keywords for 'language':
          # 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin',
          # 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
          # Use 'c-cpp' to analyze code written in C, C++, or both
          # Use 'java-kotlin' to analyze code written in Java, Kotlin, or both
          # Use 'javascript-typescript' to analyze code written in JavaScript,
          # TypeScript, or both
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
            # To learn more about changing the languages analyzed or
            # customizing the build mode, see:
            # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
            # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
      - name: Check whether analysis should run
        # Analysis runs for every event except docs-only pull requests
        # (no checkout or CodeQL work for those — the leg just reports
        # success so the per-language required checks are satisfied).
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
              || [ "${{ needs.changes.outputs.code }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      # Add any setup steps before running the `github/codeql-action/init`
      # action. This includes steps like installing compilers or runtimes
      # (`actions/setup-node` or others). This is typically only required
      # for manual builds.
      # - name: Setup runtime (example)
      #   uses: actions/setup-example@v1

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # If you wish to specify custom queries, you can do so here or in
          # a config file. By default, queries listed here will override any
          # specified in a config file. Prefix the list here with "+" to use
          # these queries and those in the config file.
          # For more information on CodeQL's query packs, refer to:
          # https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      # If the analyze step fails for one of the languages you are
      # analyzing with "We were unable to automatically build your code",
      # modify the matrix above to set the build mode to "manual" and then
      # modify this step to build your code.
      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
      - name: Run manual build steps
        if: steps.gate.outputs.run == 'true' && matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make'
          exit 1

      - name: Perform CodeQL Analysis
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
