services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Absolute path inside the container; the volume makes it durable.
      DATABASE_URL: sqlite+aiosqlite:////data/industry.db
      # Set BASE_URL in .env when serving remotely (https://...).
    volumes:
      - ./data:/data
    restart: unless-stopped
