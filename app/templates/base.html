<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}industry{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if authenticated %}
  <button class="menu-toggle" aria-controls="sidebar" aria-expanded="false">
    <svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true">
      <path d="M0 1h20M0 7h20M0 13h20" stroke="currentColor" stroke-width="2"/>
    </svg>
    <span class="sr-only">Menu</span>
  </button>
  <div class="backdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/">industry</a>
    <nav aria-label="Sections">
      <a href="/dashboard"{% if active == 'dashboard' %} class="active" aria-current="page"{% endif %}>Dashboard</a>
      <a href="/characters"{% if active == 'characters' %} class="active" aria-current="page"{% endif %}>Characters</a>
      <a href="/assets"{% if active == 'assets' %} class="active" aria-current="page"{% endif %}>Assets</a>
      {% set corp_active = active is defined and active.startswith('corp') %}
      <div class="nav-group" id="nav-corp-group">
        <button class="nav-group-toggle" type="button" aria-controls="nav-corp"
                aria-expanded="{{ 'true' if corp_active else 'false' }}">
          Corporation
        </button>
        <div class="nav-group-items" id="nav-corp"{% if not corp_active %} hidden{% endif %}>
          <a href="/corp/assets"{% if active == 'corp-assets' %} class="active" aria-current="page"{% endif %}>Assets</a>
          <a href="/corp/jobs"{% if active == 'corp-jobs' %} class="active" aria-current="page"{% endif %}>Jobs</a>
          <a href="/corp/wallets"{% if active == 'corp-wallets' %} class="active" aria-current="page"{% endif %}>Wallets</a>
          <a href="/corp/blueprints"{% if active == 'corp-blueprints' %} class="active" aria-current="page"{% endif %}>Blueprints</a>
        </div>
      </div>
    </nav>
    <footer class="sidebar-footer">
      <a href="/auth/logout">Log out</a>
    </footer>
  </aside>
{% endif %}
  <main class="{{ 'content' if authenticated else 'bare' }}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
